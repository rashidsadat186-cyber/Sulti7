<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="کهاته سلطان">
<meta name="theme-color" content="#ff1010">
<link rel="apple-touch-icon" href="sultan-icon-bright.png?v=4">
<link rel="icon" href="sultan-icon-bright.png?v=4">
<link rel="manifest" href="manifest.json">
<title>دفتر کهاته سلطان</title>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--primary:#ff1010;--bg:#ede7df;--card:#fcf9f5;--border:#b8a898;--green:#15803d;--blue:#1a56db;--red:#b91c1c;--accent:#c40d0d}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Tahoma,sans-serif;margin:0;padding:0}
body{background:var(--bg);padding:10px;font-size:14px;color:#333;max-width:480px;margin:0 auto}
.header{background:var(--primary);color:#fff;padding:12px;text-align:center;border-radius:10px;font-size:20px;font-weight:bold;border:2px solid var(--accent)}
/* ==== هدر با تصویر اصلی ==== */
.brand-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0;
  /* آدرس عکس رو اینجا بذار */
  background-image: url('assets/image_001.jpg');
  background-size: cover; /* عکس کل فضا رو بپوشونه */
  background-position: center; /* عکس وسط‌چین باشه */
  background-repeat: no-repeat;

  /* ابعاد و ظاهر */
  width: 100%;
  min-height: 160px; /* ارتفاع مناسب برای نمایش کامل عکس */
  border: 3px solid #d4af37; /* قاب طلایی دور عکس */
  border-radius: 20px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5); /* سایه برای حالت سه‌بعدی */
  position: relative;
  overflow: hidden;
}

/* چون متن‌ها و تاج داخل خود عکس هستند، این‌ها رو مخفی می‌کنیم */
.brand-logo,
.brand-copy {
  display: none !important;
}
.page-title{text-align:center;color:var(--primary);font-weight:bold;margin:12px 0 8px;font-size:17px}

/* ==== دکمه‌های سه‌بعدی براق ==== */
.backup-bar{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
  padding:12px;
  background:linear-gradient(180deg,#fdf6ec,#f5e9d6);
  border:1.5px solid var(--border);
  border-radius:16px;
}
.backup-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:52px;
  padding:10px 6px;
  border:2px solid rgba(255,255,255,.95);
  border-radius:14px;
  font-size:11.5px;
  font-weight:bold;
  color:#fff;
  cursor:pointer;
  text-shadow:0 1px 2px rgba(0,0,0,.5);
  box-shadow:
    0 5px 0 rgba(0,0,0,.3),
    0 8px 15px rgba(0,0,0,.25),
    inset 0 4px 6px rgba(255,255,255,.6),
    inset 0 -4px 8px rgba(0,0,0,.3);
  transition:transform .08s, box-shadow .08s;
  position:relative;
  overflow:hidden;
}
.backup-btn::after{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:45%;
  background:linear-gradient(180deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 100%);
  pointer-events:none;
  border-radius:12px 12px 0 0;
}
.backup-btn:active{
  transform:translateY(5px);
  box-shadow:
    0 1px 0 rgba(0,0,0,.3),
    0 2px 5px rgba(0,0,0,.2),
    inset 0 2px 3px rgba(255,255,255,.5);
}
.backup-btn .ico{font-size:18px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));position:relative;z-index:2;}
.backup-btn span:not(.ico){position:relative;z-index:2;}
.backup-btn.orange{background-image:url('assets/image_002.png');background-size:cover;background-position:center;background-color:#e65c00;border-color:transparent;}
.backup-btn.green {background-image:url('assets/image_003.png');background-size:cover;background-position:center;background-color:#0d8c3a;border-color:transparent;}
.backup-btn.blue  {background-image:url('assets/image_004.png');background-size:cover;background-position:center;background-color:#0d5ecb;border-color:transparent;}
.backup-btn.purple{background-image:url('assets/image_005.png');background-size:cover;background-position:center;background-color:#6b1fd4;border-color:transparent;}
.backup-btn.brown {background-image:url('assets/image_006.png');background-size:cover;background-position:center;background-color:#3d2312;border-color:transparent;}
.backup-btn.indigo{background-image:url('assets/image_007.png');background-size:cover;background-position:center;background-color:#441aa8;border-color:transparent;}
.backup-btn.teal  {background-image:url('assets/image_008.png');background-size:cover;background-position:center;background-color:#088a80;border-color:transparent;}
.backup-btn.gold  {background-image:url('assets/image_009.png');background-size:cover;background-position:center;background-color:#d49500;border-color:transparent;}
.backup-btn.red   {background-image:url('assets/image_010.png');background-size:cover;background-position:center;background-color:#b80000;border-color:transparent;}
.backup-btn.pink  {background-image:url('assets/image_011.png');background-size:cover;background-position:center;background-color:#c2266b;border-color:transparent;}
.backup-btn.slate {background-image:url('assets/image_012.png');background-size:cover;background-position:center;background-color:#3f4f63;border-color:transparent;}
.backup-btn.night {background-image:url('assets/image_013.png');background-size:cover;background-position:center;background-color:#1c1c3a;border-color:transparent;}

.search{width:100%;height:42px;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;font-size:15px;background:#fff;margin-bottom:8px;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.search:focus{outline:2px solid var(--primary)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}
.card{
  position:relative;
  overflow:hidden;
  border-radius:14px;
  text-align:center;
  padding:10px 6px 8px;
  border:2px solid rgba(255,255,255,.85);
  box-shadow:
    0 4px 0 rgba(0,0,0,.18),
    0 6px 12px rgba(0,0,0,.16),
    inset 0 2px 0 rgba(255,255,255,.55),
    inset 0 -3px 6px rgba(0,0,0,.12);
}
.card .icon-bubble{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 4px;font-size:14px;
  background:rgba(255,255,255,.55);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.15),0 1px 2px rgba(255,255,255,.6);
}
.card .label{font-size:11px;font-weight:bold;text-shadow:0 1px 1px rgba(255,255,255,.4)}
.card .value{display:block;font-size:12px;font-weight:bold;margin-top:4px;line-height:1.3;text-shadow:0 1px 1px rgba(255,255,255,.4)}
.card.green{background:linear-gradient(180deg,#b9f6c8,#4cd97b);}
.card.green .label,.card.green .value{color:#0d5c26}
.card.blue{background:linear-gradient(180deg,#bfe0ff,#5cb8ff);}
.card.blue .label,.card.blue .value{color:#0d3f8f}
.card.red{background:linear-gradient(180deg,#ffc9c9,#ff5252);}
.card.red .label,.card.red .value{color:#7f0d0d}
.table-wrapper{overflow-x:hidden;background:var(--card);border:1.5px solid var(--border);border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,.08)}
table.custom-table{width:100%;border-collapse:collapse;table-layout:fixed}
table.custom-table th,table.custom-table td{border:1px solid var(--border);padding:6px 2px;text-align:center;font-size:10.5px;vertical-align:middle;word-break:break-word;overflow-wrap:break-word}
table.custom-table th{
  background:linear-gradient(180deg,#a86bff,#5b1fbf);
  color:#fff;
  font-weight:bold;
  text-shadow:0 1px 1px rgba(0,0,0,.5);
  border-top:2px solid #d1b3ff;
  border-bottom:2px solid #3a1078;
}
table.custom-table tbody tr{cursor:pointer}
table.custom-table tbody tr:active{background:#f0e8dd}
.amt-num{display:block;direction:ltr;white-space:nowrap}
.custom-table .amt-num{font-size:9.5px;letter-spacing:-.3px}
.custom-table .amt-cur{font-size:8px}
.amt-cur{display:block;font-size:.85em;opacity:.8;font-weight:normal}
.amt-sep{height:4px}
.cell-phone{color:#000;font-weight:bold;direction:ltr}
.cell-receipt{color:var(--green);font-weight:bold}
.cell-debt{color:var(--blue);font-weight:bold}
.cell-remaining{color:var(--red);font-weight:bold}

/* ==== دکمه شناور + قرمز براق ==== */
.fab{
  position:fixed;bottom:20px;left:50%;
  width:66px;height:66px;
  border:3px solid #fff;border-radius:50%;
  background:linear-gradient(180deg,#ff5252,#b80000);
  color:#fff;font-size:36px;z-index:100;cursor:pointer;
  box-shadow:
    0 6px 0 rgba(0,0,0,.3),
    0 8px 18px rgba(0,0,0,.35),
    inset 0 3px 0 rgba(255,255,255,.45),
    inset 0 -4px 8px rgba(0,0,0,.3);
  transition:transform .1s, box-shadow .1s;
  display:flex;align-items:center;justify-content:center;
  line-height:1;padding-bottom:4px;
  transform:translateX(-50%);
}
.fab:active{
  transform:translateX(-50%) translateY(5px);
  box-shadow:
    0 1px 0 rgba(0,0,0,.3),
    0 3px 8px rgba(0,0,0,.3),
    inset 0 2px 0 rgba(255,255,255,.3);
}

.detail{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow:auto;padding:8px}
.detail.active{display:block}
.dh{
  background:linear-gradient(180deg,#ff2a2a,#c40d0d);
  color:#fff;padding:8px;border-radius:12px;display:flex;align-items:center;margin-bottom:8px;
  border:2px solid #fff;
  box-shadow:0 4px 0 rgba(0,0,0,.25),0 6px 12px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.25);
}
.dh button{background:0;border:0;color:#fff;font-size:24px;width:40px;height:40px;cursor:pointer;border-radius:8px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.dh button:active{background:rgba(255,255,255,.25)}
.dh span{flex:1;text-align:center;font-weight:bold;font-size:16px;text-shadow:0 1px 2px rgba(0,0,0,.4)}

.info{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:10px;margin:8px 0;box-shadow:0 2px 4px rgba(0,0,0,.06)}
.info-row{display:flex;align-items:flex-start;gap:10px}
.info-fields{flex:1;min-width:0;display:flex;flex-direction:column}
.field-line{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px dashed #d8ccbc;font-size:13px}
.field-line:last-child{border-bottom:0}
.field-label{font-weight:bold;color:#4a3728;flex:0 0 auto;white-space:nowrap}
.field-val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#555;font-size:12.5px}
.field-btn{width:24px;height:24px;flex:0 0 24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;box-shadow:inset 0 1px 2px rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.15)}
.field-edit{background:linear-gradient(180deg,#cfe4ff,#9cc3f5)}
.field-call{background:linear-gradient(180deg,#b9f6c8,#4cd97b)}
.field-map{background:linear-gradient(180deg,#cfe0ff,#a7c7ff)}
.icon-dot{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:inset 0 1px 2px rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.15)}
.icon-dot.name{background:linear-gradient(180deg,#ffd7d7,#ffb0b0)}
.icon-dot.addr{background:linear-gradient(180deg,#cfe0ff,#a7c7ff)}
.icon-dot.phone{background:linear-gradient(180deg,#c8f5d6,#9fe8b7)}
.icon-dot.khata{background:linear-gradient(180deg,#ead7ff,#c7a5f4)}

.info-avatar-col{flex:0 0 auto}
.info-avatar{width:78px;height:78px;border-radius:50%;overflow:hidden;position:relative;cursor:pointer;border:3px solid #fff;background:linear-gradient(180deg,#f2ede4,#e2d8c8);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.18),0 6px 12px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.5)}
.info-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.info-avatar .placeholder-ico{font-size:32px;color:#a89478}
.info-avatar .cam-badge{position:absolute;bottom:-2px;left:-2px;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#ffb35c,#e65c00);display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25)}

.photo-viewer{display:none;position:fixed;inset:0;background:#000;z-index:1500;align-items:center;justify-content:center}
.photo-viewer.active{display:flex}
.photo-viewer img{max-width:100%;max-height:100%;object-fit:contain}
.photo-viewer .pv-close{position:absolute;top:14px;left:14px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1.5px solid rgba(255,255,255,.4)}
.photo-viewer .pv-actions{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.photo-viewer .pv-actions button{border:2px solid rgba(255,255,255,.9);border-radius:10px;padding:10px 16px;font-weight:bold;color:#fff;cursor:pointer;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.4)}

.detail-bottom-bar{position:sticky;bottom:0;display:flex;justify-content:center;gap:14px;padding:10px 0 2px;margin-top:10px}
.round-btn{
  width:52px;height:52px;border-radius:50%;position:relative;
  border:2px solid rgba(255,255,255,.9);
  background:linear-gradient(180deg,#ffffff,#e7e2d8);
  display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.18),0 6px 12px rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.08);
  transition:transform .08s, box-shadow .08s;
}
.round-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.4)}
.round-btn .badge{position:absolute;top:-3px;left:-3px;background:var(--red);color:#fff;font-size:10px;font-weight:bold;min-width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.balance{
  background:linear-gradient(180deg,#fff5f5,#ffe0e0);
  border:1.5px solid #f5b8b8;border-radius:12px;padding:12px;margin:8px 0;text-align:center;font-weight:bold;font-size:15px;color:var(--primary);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.08);
}

/* ==== دکمه‌های رسید/قرض براق ==== */
.actions{display:flex;gap:8px;margin:10px 0 90px}
.actions button{
  flex:1;border:2px solid rgba(255,255,255,.9);border-radius:14px;color:#fff;padding:14px;font-weight:bold;cursor:pointer;font-size:14px;
  text-shadow:0 1px 2px rgba(0,0,0,.4);
  box-shadow:
    0 4px 0 rgba(0,0,0,.25),
    0 6px 12px rgba(0,0,0,.22),
    inset 0 2px 0 rgba(255,255,255,.4),
    inset 0 -3px 6px rgba(0,0,0,.2);
  transition:transform .08s, box-shadow .08s;
}
.actions button:active{
  transform:translateY(4px);
  box-shadow:
    0 1px 0 rgba(0,0,0,.25),
    0 2px 5px rgba(0,0,0,.2),
    inset 0 1px 0 rgba(255,255,255,.3);
}
.btn-receipt{background:linear-gradient(180deg,#4cd97b,#0d8c3a)}
.btn-debt{background:linear-gradient(180deg,#5cb8ff,#0d5ecb)}

.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;padding:12px}
.modalbg.active{display:flex}
.modal{background:var(--card);width:100%;max-width:400px;border-radius:16px;padding:16px;max-height:90vh;overflow:auto;border:2px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.modal h3{text-align:center;color:var(--primary);margin:0 0 10px;font-size:16px;border-bottom:1.5px solid #dcd0c0;padding-bottom:6px}
.modal label{display:block;font-weight:bold;margin-top:8px;font-size:12px}
.modal input,.modal select{width:100%;height:40px;border:1.5px solid #a39382;border-radius:8px;padding:6px 10px;font-size:14px;margin:3px 0;background:#fff;box-shadow:inset 0 2px 3px rgba(0,0,0,.06)}
.modal input:focus,.modal select:focus{outline:2px solid var(--primary)}
.buttons{display:flex;gap:6px;margin-top:14px}
.buttons button{
  flex:1;min-height:44px;border:2px solid rgba(255,255,255,.9);border-radius:10px;font-weight:bold;cursor:pointer;font-size:13px;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.4);
  box-shadow:
    0 3px 0 rgba(0,0,0,.22),
    0 4px 10px rgba(0,0,0,.18),
    inset 0 2px 0 rgba(255,255,255,.4),
    inset 0 -2px 4px rgba(0,0,0,.18);
  transition:transform .08s, box-shadow .08s;
}
.buttons button:active{
  transform:translateY(3px);
  box-shadow:
    0 1px 0 rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.3);
}
.cancel{background:linear-gradient(180deg,#f0f0f0,#d4d4d4);color:#333;text-shadow:none;border-color:rgba(255,255,255,.7)}
.confirm{background:linear-gradient(180deg,#ff5252,#b80000)}
.confirm.blue{background:linear-gradient(180deg,#5cb8ff,#0d5ecb)}
.confirm.green{background:linear-gradient(180deg,#4cd97b,#0d8c3a)}
.confirm.red{background:linear-gradient(180deg,#ff5252,#b80000)}

.toast{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:10px;z-index:9999;font-size:12px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.toast.show{display:block}
.toast.error{background:var(--red)}
.toast.success{background:var(--green)}
.section-divider{border-top:2px dashed var(--border);margin:10px 0 4px;padding-top:6px;font-weight:bold;color:var(--primary);font-size:12px}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.empty-state{padding:24px 12px!important;color:#777;font-size:13px}

/* ===== طراحی جدید دستیار هوش مصنوعی ===== */
.chat-fab{
  position:fixed;bottom:20px;right:20px;width:64px;height:64px;border:3px solid #fff;border-radius:50%;
  background:linear-gradient(145deg,#7c3aed,#4f46e5);
  color:#fff;z-index:100;cursor:pointer;
  box-shadow:0 6px 0 rgba(0,0,0,.28),0 9px 18px rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.45);
  display:flex;align-items:center;justify-content:center;
  transition:transform .08s,box-shadow .08s;
  overflow:hidden;
}
.chat-fab .bot-avatar{
  width:47px;height:47px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#fff,#e9e2d7);
  border:2px solid rgba(255,255,255,.95);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.12),0 2px 5px rgba(0,0,0,.18);
  font-size:29px;
}
.chat-fab .bot-crown{
  position:absolute;top:1px;right:5px;font-size:17px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));
}
.chat-fab:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28),0 4px 9px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.3)}

.chat-panel{display:none;position:fixed;inset:0;background:linear-gradient(180deg,#f4efe8,#ede7df);z-index:300;flex-direction:column}
.chat-panel.active{display:flex}
.chat-header{
  background:linear-gradient(180deg,#7c3aed,#4f46e5);color:#fff;padding:8px 9px;border-radius:15px;
  display:flex;align-items:center;margin:8px;border:2px solid #fff;
  box-shadow:0 5px 0 rgba(0,0,0,.22),0 8px 15px rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35);
}
.chat-header .chat-avatar{
  width:40px;height:40px;min-width:40px;border-radius:50%;background:linear-gradient(145deg,#fff,#e9e2d7);
  display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid #fff;
  box-shadow:0 2px 5px rgba(0,0,0,.2);position:relative;
}
.chat-header .chat-avatar:after{content:"👑";position:absolute;right:-4px;top:-8px;font-size:15px}
.chat-header .chat-title{flex:1;text-align:right;padding:0 9px;font-weight:bold;font-size:15px;line-height:1.3}
.chat-header .chat-status{display:block;font-size:10px;font-weight:normal;opacity:.9;margin-top:2px}
.chat-header button{background:0;border:0;color:#fff;font-size:24px;width:40px;height:40px;cursor:pointer;border-radius:8px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.chat-header button:active{background:rgba(255,255,255,.25)}
.chat-messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.chat-msg{max-width:82%;padding:10px 13px;border-radius:15px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word;position:relative}
.chat-msg.user{align-self:flex-end;background:linear-gradient(180deg,#5cb8ff,#0d5ecb);color:#fff;border-bottom-left-radius:4px;box-shadow:0 3px 6px rgba(0,0,0,.15)}
.chat-msg.assistant{align-self:flex-start;background:#fffaf4;border:1.5px solid #d7c8b7;color:#333;border-bottom-right-radius:4px;box-shadow:0 3px 7px rgba(0,0,0,.10);padding-left:14px}
.chat-msg.assistant:before{content:"🤖";position:absolute;right:-31px;bottom:0;width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #d7c8b7;font-size:15px;box-shadow:0 2px 4px rgba(0,0,0,.12)}
.chat-msg.error{align-self:center;background:#fdecea;color:var(--red);border:1px solid #f5c2c0;font-size:12px}
.chat-msg.thinking{align-self:flex-start;background:#fffaf4;border:1px solid #d7c8b7;color:#888;font-style:italic}
.chat-msg.tool{align-self:flex-start;background:#eef2ff;border:1px dashed #94a3b8;color:#475569;font-size:12px}
.chat-inputbar{display:flex;gap:7px;padding:9px;background:#fffaf4;border-top:1.5px solid #d7c8b7;box-shadow:0 -3px 10px rgba(0,0,0,.06)}
.chat-inputbar textarea{flex:1;resize:none;border:1.5px solid #c9b8a7;border-radius:13px;padding:9px 11px;font-size:14px;min-height:42px;max-height:100px;font-family:inherit;box-shadow:inset 0 2px 3px rgba(0,0,0,.06)}
.chat-inputbar textarea:focus{outline:2px solid #7c3aed}
.chat-send{
  width:48px;border:2px solid rgba(255,255,255,.9);border-radius:13px;color:#fff;font-size:20px;cursor:pointer;
  background:linear-gradient(180deg,#7c3aed,#4f46e5);
  box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4);
  transition:transform .08s;
}
.chat-send:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.chat-send:disabled{opacity:.5}
.chat-clear{background:0;border:0;color:#fff;font-size:13px;text-decoration:underline;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.chat-empty{color:#777;font-size:13px;text-align:center;padding:30px 12px;background:rgba(255,255,255,.55);border-radius:16px;margin:10px;border:1px solid #d7c8b7}
.chat-empty .empty-avatar{font-size:48px;display:block;margin-bottom:8px}

.chat-fab{
  position:fixed;bottom:20px;right:20px;width:58px;height:58px;border:3px solid #fff;border-radius:50%;
  background:linear-gradient(180deg,#5cb8ff,#0d5ecb);
  color:#fff;font-size:26px;z-index:100;cursor:pointer;
  box-shadow:
    0 5px 0 rgba(0,0,0,.3),
    0 7px 16px rgba(0,0,0,.32),
    inset 0 3px 0 rgba(255,255,255,.45),
    inset 0 -4px 8px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;
  transition:transform .08s, box-shadow .08s;
}
.chat-fab:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 rgba(0,0,0,.3),0 3px 8px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.3);
}
.chat-panel{display:none;position:fixed;inset:0;background:var(--bg);z-index:300;flex-direction:column}
.chat-panel.active{display:flex}
.chat-header{background:linear-gradient(180deg,#3d8cd6,#1e4e7f);color:#fff;padding:8px;border-radius:12px;display:flex;align-items:center;margin:8px;border:2px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.25),0 6px 12px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35)}
.chat-header button{background:0;border:0;color:#fff;font-size:24px;width:40px;height:40px;cursor:pointer;border-radius:8px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.chat-header button:active{background:rgba(255,255,255,.25)}
.chat-header span{flex:1;text-align:center;font-weight:bold;font-size:16px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.chat-messages{flex:1;overflow-y:auto;padding:0 10px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:85%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.chat-msg.user{align-self:flex-end;background:linear-gradient(180deg,#5cb8ff,#0d5ecb);color:#fff;border-bottom-left-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.chat-msg.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--border);color:#333;border-bottom-right-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.chat-msg.error{align-self:center;background:#fdecea;color:var(--red);border:1px solid #f5c2c0;font-size:12px}
.chat-msg.thinking{align-self:flex-start;background:var(--card);border:1px solid var(--border);color:#888;font-style:italic}
.chat-msg.tool{align-self:flex-start;background:#eef2ff;border:1px dashed #94a3b8;color:#475569;font-size:12px}
.chat-inputbar{display:flex;gap:6px;padding:8px;background:var(--card);border-top:1.5px solid var(--border)}
.chat-inputbar textarea{flex:1;resize:none;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;font-size:14px;min-height:42px;max-height:100px;font-family:inherit;box-shadow:inset 0 2px 3px rgba(0,0,0,.06)}
.chat-inputbar textarea:focus{outline:2px solid #2b6cb0}
.chat-send{
  width:48px;border:2px solid rgba(255,255,255,.9);border-radius:10px;color:#fff;font-size:20px;cursor:pointer;
  background:linear-gradient(180deg,#5cb8ff,#0d5ecb);
  box-shadow:0 3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4);
  transition:transform .08s;
}
.chat-send:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.chat-send:disabled{opacity:.5}
.chat-clear{background:0;border:0;color:#fff;font-size:13px;text-decoration:underline;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.chat-empty{color:#888;font-size:13px;text-align:center;padding:30px 12px}

/* ===== قفل برنامه ===== */
.lock-screen{position:fixed;inset:0;background:linear-gradient(180deg,#ff2a2a,#c40d0d);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-screen.hidden{display:none}
.lock-box{background:var(--card);color:#333;border-radius:16px;padding:22px 18px;width:100%;max-width:320px;text-align:center;border:2px solid #fff;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.lock-box h2{color:var(--primary);margin-bottom:6px;font-size:18px}
.lock-box p{font-size:12px;color:#666;margin-bottom:8px}
.lock-box input{width:100%;height:46px;border:1.5px solid var(--border);border-radius:10px;text-align:center;font-size:22px;letter-spacing:8px;margin:6px 0;direction:ltr;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.lock-box input:focus{outline:2px solid var(--primary)}
.lock-box button{
  width:100%;height:48px;border:2px solid rgba(255,255,255,.9);border-radius:12px;color:#fff;font-weight:bold;font-size:15px;cursor:pointer;margin-top:8px;
  background:linear-gradient(180deg,#ff5252,#b80000);
  text-shadow:0 1px 2px rgba(0,0,0,.4);
  box-shadow:0 4px 0 rgba(0,0,0,.25),0 6px 12px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.4);
}
.lock-box button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.3)}
.lock-msg{font-size:12px;color:var(--red);min-height:16px;margin-top:4px}
.lock-sub{font-size:12px;color:#777;margin-top:14px}
.lock-sub a{color:var(--blue);cursor:pointer;text-decoration:underline}

/* ===== نسخه دسکتاپ / لپ‌تاپ ===== */
@media (min-width:1000px){
  body{
    max-width:1320px;
    padding:28px 34px 60px;
    font-size:15px;
    display:grid;
    grid-template-columns:330px 1fr;
    column-gap:26px;
    row-gap:16px;
    align-items:start;
  }
  .header{grid-column:1/3;grid-row:1;font-size:25px;padding:18px;border-radius:16px}
  .brand-logo{width:72px;height:40px;flex:0 0 40px}
  .brand-logo svg{width:66px;height:38px}
  .brand-name{font-size:25px}
  .brand-subtitle{font-size:13px}
  .page-title{grid-column:2;grid-row:2;font-size:21px;margin:0;text-align:right}
  .backup-bar{grid-column:1;grid-row:2/7;grid-template-columns:1fr;gap:9px;margin-bottom:0;padding:12px}
  .backup-btn{font-size:13.5px;padding:13px 14px;min-height:54px;justify-content:flex-start;border-radius:14px;direction:rtl}
  .backup-btn .ico{font-size:22px}
  #search{grid-column:1;grid-row:7}
  .search{height:48px;font-size:15px;margin-bottom:0}
  #summary{grid-column:1;grid-row:8}
  .summary{grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
  .card{padding:12px 5px}
  .card .label{font-size:12px}
  .card .value{font-size:14.5px;margin-top:6px}
  .table-wrapper{grid-column:2;grid-row:3/9;align-self:stretch}
  table.custom-table{min-width:100%;font-size:14.5px}
  table.custom-table th,table.custom-table td{padding:14px 10px;font-size:14px}
  table.custom-table th{font-size:14px}

  .fab{left:34px;right:auto;transform:none;bottom:34px;width:70px;height:70px;font-size:38px}
  .fab:active{transform:translateY(5px)}

  .detail{position:fixed;inset:auto;top:26px;bottom:26px;right:50%;left:auto;transform:translateX(50%);
    width:min(760px,92vw);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.35);border:1px solid var(--border);padding:16px}

  .chat-panel{position:fixed;inset:auto;top:auto;left:auto;right:26px;bottom:96px;
    width:420px;height:620px;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.35);
    border:1px solid var(--border);overflow:hidden}

  .modal{max-width:480px}
}
/* ===== اصلاح کامل راست‌به‌چپ ===== */
html,body{direction:rtl}
body{text-align:right}
input,select,textarea{direction:rtl;text-align:right}
label,.modal label{direction:rtl;text-align:right}
.backup-btn{direction:rtl}
.backup-btn .ico{margin-left:2px}
.custom-table th,.custom-table td{direction:rtl}
.custom-table th:first-child,.custom-table td:first-child,
.custom-table th:nth-child(3),.custom-table td:nth-child(3){text-align:center}
.custom-table th:nth-child(2),.custom-table td:nth-child(2){text-align:right}
.custom-table .amt-num,.custom-table .amt-cur,
.cell-phone,.lock-box input{direction:ltr}
.field-line{direction:rtl}
.field-label{order:1}
.field-val{order:2;text-align:right}
.field-btn{order:3}
.icon-dot{order:4}
.chat-messages{direction:rtl}
.chat-msg{direction:rtl;text-align:right}
.chat-inputbar{direction:rtl}
.chat-inputbar textarea{direction:rtl;text-align:right}
.modal{direction:rtl}
.buttons{direction:rtl}
.detail{direction:rtl}
.dh{direction:rtl}
.dh button:first-child{order:4}
.dh span{order:2}
.dh button:last-child{order:1}

/* ===== چیدمان نهایی مطابق طرح مرجع ===== */
.info{
  background:#fcf9f5;
  border:2px solid #c9bbaa;
  border-radius:16px;
  padding:12px 10px;
  margin:10px 0;
  box-shadow:0 4px 0 rgba(0,0,0,.12),0 6px 14px rgba(0,0,0,.10);
}
.info-row{
  direction:ltr !important;
  display:flex;
  align-items:center;
  gap:14px;
}
.info-avatar-col{
  order:1;
  flex:0 0 105px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.info-avatar{
  width:96px;
  height:96px;
  border-radius:50%;
  border:4px solid #fff;
  outline:2px solid #e6bd65;
  background:linear-gradient(145deg,#f5f0e7,#ddd3c2);
  box-shadow:0 5px 0 rgba(0,0,0,.16),0 7px 15px rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.8);
}
.info-avatar .placeholder-ico{font-size:42px}
.info-avatar .cam-badge{
  width:29px;height:29px;left:-4px;bottom:-4px;
  background:#fff;color:#1671d9;border:2px solid #fff;
  box-shadow:0 2px 5px rgba(0,0,0,.25);font-size:15px;
}
.info-fields{
  order:2;
  flex:1;
  min-width:0;
  direction:rtl !important;
}
.field-line{
  direction:rtl !important;
  min-height:47px;
  padding:7px 0;
  gap:8px;
  font-size:16px;
  border-bottom:2px dashed #ddd2c4;
}
.field-label{font-size:17px;color:#4a3728;font-weight:800}
.field-val{font-size:16px;color:#555}
.field-btn,.icon-dot{
  width:30px;height:30px;flex:0 0 30px;font-size:14px;
}
.field-btn{cursor:pointer}
@media(max-width:390px){
  .info-row{gap:8px}
  .info-avatar-col{flex-basis:88px}
  .info-avatar{width:82px;height:82px}
  .field-line{min-height:42px;font-size:14px}
  .field-label{font-size:15px}
  .field-val{font-size:14px}
  .field-btn,.icon-dot{width:27px;height:27px;flex-basis:27px;font-size:12px}
}

/* نوار دستیار در پایین صفحه مثل طرح مرجع */
.chat-fab{
  width:56px;height:56px;
  right:18px;bottom:18px;
  background:linear-gradient(145deg,#8b5cf6,#5b21b6);
  border:3px solid #fff;
  box-shadow:0 6px 0 rgba(0,0,0,.25),0 9px 18px rgba(0,0,0,.20),inset 0 3px 0 rgba(255,255,255,.45);
}
.chat-fab .bot-avatar{font-size:25px;width:40px;height:40px}
.chat-fab .bot-crown{font-size:15px;top:0;right:3px}

/* پایین صفحه جا برای دکمه چت/بنر */
.detail-bottom-bar{position:relative;z-index:10}

/* ==== سطر بدهکاران بزرگ ==== */
.hot-row{background:linear-gradient(180deg,#fff2f2,#ffe1e1)!important}
.hot-row:active{background:#ffd0d0!important}

/* ==== دکمه‌های گرد جدید در صورت حساب ==== */
.round-btn.wa{background:linear-gradient(180deg,#5fe08a,#16a34a)}
.round-btn.print{background:linear-gradient(180deg,#c9c9c9,#8a8a8a)}

/* ==== بزرگ‌نمایی متن ==== */

body.dark .hot-row:active{background:#3a1c1c!important}

body.dark .empty-state{color:#999}

/* =====================  UI کرستالی / شیشه‌یی  ===================== */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* --- نوار جستجو --- */
.search,body.dark .search{
  height:46px;border:0;border-radius:0;padding:0 30px;margin-bottom:8px;
  background-color:transparent;box-shadow:none;-webkit-appearance:none;appearance:none;
  color:#1d2b4a;font-weight:600;
  background-image:url("assets/image_014.webp"),url("assets/image_015.webp"),url("assets/image_016.webp");
  background-repeat:no-repeat;
  background-position:left center,right center,center;
  background-size:auto 100%,auto 100%,calc(100% - 40px) 100%;
  filter:drop-shadow(0 3px 4px rgba(40,60,140,.28));
}
.search::placeholder{color:#5b6b90;opacity:1;font-weight:600}
.search:focus,body.dark .search:focus{outline:none;filter:drop-shadow(0 0 7px rgba(90,110,255,.8))}

/* --- ترتیب و فیلتر --- */
.list-toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px;align-items:stretch}
.filter-chips{display:contents}
.sort-pill,.filter-chips button{position:relative;width:100%;min-width:0;height:auto;aspect-ratio:1.4;padding:0;border:0;background-color:transparent;background-repeat:no-repeat;background-size:100% 100%;background-position:center;transition:transform .08s,filter .15s}
.sort-pill{background-image:url("assets/image_017.webp");filter:drop-shadow(0 3px 3px rgba(40,60,130,.2))}
.sort-pill:active{transform:translateY(2px)}
.sort-pill .sort-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 12%;text-align:center;font-size:12px;font-weight:800;line-height:1.25;color:#3a2418;text-shadow:0 1px 0 rgba(255,255,255,.75);pointer-events:none}
.list-toolbar select{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;background:transparent;font-size:16px;cursor:pointer;-webkit-appearance:none;appearance:none}
.filter-chips button{color:transparent;text-shadow:none;font-size:14px;font-weight:800;cursor:pointer;filter:drop-shadow(0 3px 3px rgba(40,60,130,.18)) saturate(.85) opacity(.9)}
.filter-chips button.active{filter:drop-shadow(0 0 7px rgba(110,90,255,.75)) drop-shadow(0 3px 3px rgba(40,60,130,.2));transform:translateY(-1px)}
.filter-chips button:active{transform:translateY(2px)}
.filter-chips button[data-f="all"]{background-image:url("assets/image_018.webp")}
.filter-chips button[data-f="debtor"]{background-image:url("assets/image_019.webp")}
.filter-chips button[data-f="creditor"]{background-image:url("assets/image_020.webp");color:#0b2a9a;text-shadow:0 1px 0 rgba(255,255,255,.9),0 0 6px rgba(255,255,255,.75)}

/* --- کارت‌های خلاصه --- */
.card,.card.green,.card.blue,.card.red{
  background:none;border:0;box-shadow:none;padding:0;overflow:visible;
  display:flex;flex-direction:column;text-align:center;
  filter:drop-shadow(0 4px 5px rgba(0,30,60,.25));
}
.card .ct,.card .cb{display:block;width:100%;flex:0 0 auto;background-repeat:no-repeat;background-size:100% 100%}
.card .cm{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:0 8px;background-repeat:no-repeat;background-size:100% 100%}
.card .value{margin:0;font-size:12.5px;line-height:1.3;font-weight:800}
.card .amt-num,.card .amt-cur{display:inline-block;margin:0 2px;opacity:1}

<script>
// ========================== داده ==========================
var debtors = [];
var current = null;
var sortMode = 'default';
var filterMode = 'all';
try{ sortMode = localStorage.getItem('khatabook_sort') || 'default'; }catch(e){}

function $(id){return document.getElementById(id);}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function num(n){return (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});}
function normalizeDigits(v){
  return String(v==null?'':v).replace(/[۰-۹]/g,function(d){return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d));});
}
function amount(v){
  var s=normalizeDigits(v).replace(/,/g,'').trim();
  if(!/^\d+(?:\.\d{1,2})?$/.test(s))return NaN;
  var n=Number(s);
  return isFinite(n)&&n>0?n:NaN;
}
function storedAmount(v){
  var n=Number(normalizeDigits(v).replace(/,/g,''));
  return isFinite(n)&&n>0?n:0;
}
function sanitizeAmountInput(el){
  var v=normalizeDigits(el.value).replace(/,/g,'').replace(/[^\d.]/g,'');
  var dot=v.indexOf('.');
  if(dot!==-1)v=v.slice(0,dot+1)+v.slice(dot+1).replace(/\./g,'').slice(0,2);
  el.value=v;
}
function normalizeNumberInput(el){
  el.value=normalizeDigits(el.value).replace(/[^\d+]/g,'');
}
function normalizeDateInput(el){
  el.value=normalizeDigits(el.value).replace(/[^\d\/.-]/g,'').replace(/-/g,'/');
}
function normalizeDateValue(v){
  var s=normalizeDigits(v||'').trim().replace(/-/g,'/').replace(/\./g,'/');
  var parts=s.split('/').filter(function(p){return p!=='';});
  if(parts.length!==3)return s;
  var y=parts[0],m=parts[1],d=parts[2];
  if(y.length<4 && parts[2].length===4){
    var tmp=y; y=d; d=tmp;
  }
  m=m.padStart(2,'0');
  d=d.padStart(2,'0');
  return y+'/'+m+'/'+d;
}
function normalizeData(input){
  var list=Array.isArray(input)?input:(input&&Array.isArray(input.debtors)?input.debtors:null);
  if(!list)return null;
  return list.map(function(raw,i){
    raw=raw&&typeof raw==='object'?raw:{};
    var d={
      id:raw.id!==undefined&&raw.id!==null&&String(raw.id)!==''?raw.id:Date.now()+i,
      name:String(raw.name||'').trim()||('حساب '+(i+1)),
      phone:String(raw.phone||'').trim(),
      khataNumber:String(raw.khataNumber||'').trim(),
      address:String(raw.address||'').trim(),
      transactions:[]
    };
    if(raw.photo && typeof raw.photo==='string' && raw.photo.indexOf('data:image')===0){
      d.photo=raw.photo;
    }
    var txs=Array.isArray(raw.transactions)?raw.transactions:[];
    d.transactions=txs.map(function(tx,j){
      tx=tx&&typeof tx==='object'?tx:{};
      var oldReceipt=tx.receipt===undefined?tx.debt:tx.receipt;
      var oldDebt=tx.debtVal===undefined?tx.paid:tx.debtVal;
      var receipt=storedAmount(oldReceipt),debtVal=storedAmount(oldDebt);
      return {
        id:tx.id!==undefined&&tx.id!==null&&String(tx.id)!==''?tx.id:Date.now()+100000+i*1000+j,
        date:normalizeDateValue(String(tx.date||'').trim()||today()),
        currency:tx.currency==='USD'?'USD':'AFN',
        details:String(tx.details||'').trim()||(receipt?'رسید':'قرض'),
        receipt:receipt,
        debtVal:debtVal,
        page:String(tx.page||'').trim()
      };
    });
    return d;
  });
}

function today(){
  try{
    var d=new Date(), f=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'});
    var p=f.formatToParts(d), y='',m='',day='';
    for(var i=0;i<p.length;i++){if(p[i].type==='year')y=p[i].value;if(p[i].type==='month')m=p[i].value;if(p[i].type==='day')day=p[i].value;}
    var toEn=function(s){var map={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};return s.replace(/[۰-۹]/g,function(d){return map[d];});};
    return toEn(y)+'/'+toEn(m).padStart(2,'0')+'/'+toEn(day).padStart(2,'0');
  }catch(e){var d=new Date();return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}
}

function getTotals(d){
  var aR=0,aD=0,uR=0,uD=0;
  if(d.transactions)for(var i=0;i<d.transactions.length;i++){
    var t=d.transactions[i], c=t.currency||'AFN', r=+t.receipt||+t.debt||0, deb=+t.debtVal||+t.paid||0;
    if(c==='AFN'){aR+=r;aD+=deb;}else{uR+=r;uD+=deb;}
  }
  return {afnR:aR,afnD:aD,usdR:uR,usdD:uD,afnRem:aR-aD,usdRem:uR-uD};
}

function amtHtml(v,c){return '<span class="amt-num">'+num(v)+'</span><span class="amt-cur">'+c+'</span>';}
function fmt(a,u){var p=[];if(a!==0)p.push(amtHtml(a,'AFN'));if(u!==0)p.push(amtHtml(u,'USD'));return p.length?p.join('<div class="amt-sep"></div>'):amtHtml(0,'AFN');}

// ========================== مرتب‌سازی / فیلتر / نشان بدهکار بزرگ ==========================
function netRemaining(d){var t=getTotals(d);return t.afnRem!==0?t.afnRem:t.usdRem;}
function lastTxDate(d){
  if(!d.transactions||!d.transactions.length)return '';
  var max='';
  for(var i=0;i<d.transactions.length;i++){var dt=d.transactions[i].date||'';if(dt>max)max=dt;}
  return max;
}
function syncSortLabel(){var s=$('sortSel'),l=$('sortLbl');if(s&&l){var o=s.options[s.selectedIndex];l.textContent=o?o.text:'';}}
function setSort(v){sortMode=v;try{localStorage.setItem('khatabook_sort',v);}catch(e){}syncSortLabel();render();}
function setFilter(v){
  filterMode=v;
  var btns=document.querySelectorAll('.filter-chips button');
  for(var i=0;i<btns.length;i++){btns[i].classList.toggle('active',btns[i].getAttribute('data-f')===v);}
  render();
}

// ========================== نرخ تبدیل ارز ==========================
function getUsdRate(){try{var r=Number(localStorage.getItem('khatabook_usd_rate'));return isFinite(r)&&r>0?r:0;}catch(e){return 0;}}
function setUsdRateVal(r){try{if(r)localStorage.setItem('khatabook_usd_rate',String(r));else localStorage.removeItem('khatabook_usd_rate');}catch(e){}}
function rateSettings(){
  var cur=getUsdRate();
  modal('<h3>💱 نرخ تبدیل ارز</h3>'+
    '<p style="font-size:12px;color:#666;margin:0 0 10px;">یک دالر امریکایی برابر با چند افغانی است؟ با تعیین این نرخ، مجموع «باقی مانده» به‌صورت یک‌جا (بر اساس افغانی) هم نشان داده می‌شود.</p>'+
    '<label>نرخ (AFN به ازای ۱ USD)</label><input id="rateInput" type="text" inputmode="numeric" lang="en" dir="ltr" value="'+(cur||'')+'" placeholder="مثلاً 70" oninput="normalizeNumberInput(this)">'+
    '<div class="buttons"><button class="cancel" onclick="closeModal()">لغو</button><button class="confirm red" id="clearRateBtn">حذف نرخ</button><button class="confirm" id="saveRateBtn">ذخیره</button></div>');
  $('saveRateBtn').onclick=function(){
    var v=Number(normalizeDigits($('rateInput').value));
    if(!isFinite(v)||v<=0){toast('نرخ معتبر وارد کنید','error');return;}
    setUsdRateVal(v);closeModal();render();if(current)renderDetail();toast('✅ نرخ ذخیره شد','success');
  };
  $('clearRateBtn').onclick=function(){setUsdRateVal(0);closeModal();render();if(current)renderDetail();toast('نرخ حذف شد','success');};
}
function combinedAfn(afn,usd){var r=getUsdRate();return r?(afn+usd*r):null;}
function summaryCardsHtml(afnR,usdR,afnD,usdD){
  var afnRem=afnR-afnD,usdRem=usdR-usdD;
  var combined=combinedAfn(afnRem,usdRem);
  var combinedLine=combined!==null?('<div style="font-size:10px;opacity:.8;margin-top:3px;">≈ '+num(combined)+' AFN</div>'):'';
  return '<div class="card green"><i class="ct"></i><span class="sr-only">مجموع رسید</span><div class="cm"><div class="value">'+fmt(afnR,usdR)+'</div></div><i class="cb"></i></div>'+
    '<div class="card blue"><i class="ct"></i><span class="sr-only">مجموع قرض</span><div class="cm"><div class="value">'+fmt(afnD,usdD)+'</div></div><i class="cb"></i></div>'+
    '<div class="card red"><i class="ct"></i><span class="sr-only">باقی مانده</span><div class="cm"><div class="value">'+fmt(afnRem,usdRem)+'</div>'+combinedLine+'</div><i class="cb"></i></div>';
}

// ========================== حالت شب و بزرگ‌نمایی ==========================
function isDarkMode(){try{return localStorage.getItem('khatabook_dark')==='1';}catch(e){return false;}}
function applyDarkMode(){
  var on=isDarkMode();
  document.body.classList.toggle('dark',on);
  var ic=$('darkIco'),lb=$('darkLbl');
  if(ic)ic.textContent=on?'☀️':'🌙';
  if(lb)lb.textContent=on?'حالت روز':'حالت شب';
}
function toggleDarkMode(){try{localStorage.setItem('khatabook_dark',isDarkMode()?'0':'1');}catch(e){}applyDarkMode();}
function isZoomOn(){try{return localStorage.getItem('khatabook_zoom')==='1';}catch(e){return false;}}
function applyZoom(){
  var on=isZoomOn();
  document.body.classList.toggle('zoom-lg',on);
  var ic=$('zoomIco'),lb=$('zoomLbl');
  if(ic)ic.textContent=on?'🔍':'🔤';
  if(lb)lb.textContent=on?'اندازه عادی':'بزرگ‌نمایی';
}
function toggleZoom(){try{localStorage.setItem('khatabook_zoom',isZoomOn()?'0':'1');}catch(e){}applyZoom();}

var cloudSyncing=false;var lastCloudJSON=null;var cloudSaveTimer=null;var localSavedAt=null;
function cloudPush(){
  if(!CLOUD_DOC) return;
  var payload={version:'2.7',debtors:debtors,savedAt:localSavedAt||new Date().toISOString()};
  var json=JSON.stringify(payload);
  if(json===lastCloudJSON) return;
  CLOUD_DOC.set(payload).then(function(){
    lastCloudJSON=json;
  }).catch(function(e){
    console.error('cloud save error',e);
  });
}
function scheduleCloudPush(){clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(cloudPush,800);}
function attachCloudSync(){
  if(!CLOUD_DOC) return;
  CLOUD_DOC.onSnapshot(function(doc){
    if(!doc.exists){
      if(debtors.length) scheduleCloudPush();
      return;
    }
    var data=doc.data()||{};
    var json=JSON.stringify(data);
    if(json===lastCloudJSON) return;

    var cloudTime=Date.parse(data.savedAt||'')||0;
    var localTime=Date.parse(localSavedAt||'')||0;
    if(localTime && cloudTime && localTime>cloudTime){
      lastCloudJSON=null;
      scheduleCloudPush();
      return;
    }

    lastCloudJSON=json;
    var normalized=normalizeData(data.debtors||[]);
    debtors=normalized||[];
    localSavedAt=data.savedAt||new Date().toISOString();
    try{localStorage.setItem('khatabook_data',JSON.stringify({version:data.version||'2.7',debtors:debtors,savedAt:localSavedAt}));}catch(e){}
    render();
    toast('🔄 اطلاعات همگام‌سازی شد','success');
  },function(err){console.error('cloud sync error',err);});
}
function manualSync(){
  if(!CLOUD_DOC){toast('اتصال ابری در دسترس نیست','error');return;}
  lastCloudJSON=null;
  cloudPush();
  toast('🔄 در حال همگام‌سازی...','success');
}
function save(){
  localSavedAt=new Date().toISOString();
  try{
    localStorage.setItem('khatabook_data',JSON.stringify({version:'2.7',debtors:debtors,savedAt:localSavedAt}));
  }catch(e){
    toast('ذخیره‌سازی مرورگر در دسترس نیست','error');
  }
  scheduleCloudPush();
}

function load(){
  try{
    var x=localStorage.getItem('khatabook_data');
    if(x){
      var parsed=JSON.parse(x);
      var normalized=normalizeData(parsed);
      debtors=normalized||[];
      localSavedAt=parsed&&parsed.savedAt?parsed.savedAt:null;
    }else{
      debtors=[];
      localSavedAt=null;
    }
  }catch(e){
    debtors=[];
    localSavedAt=null;
  }
  attachCloudSync();
}

// ========================== بکاپ ==========================
function exportBackup(){
  if(!debtors.length){toast('داده‌ای نیست','error');return;}
  downloadBackup('✅ بکاپ ذخیره شد');
}

function saveToKoder(){
  if(!debtors.length){toast('داده‌ای نیست','error');return;}
  downloadBackup('✅ از Share، گزینه Koder یا Save to Files را انتخاب کن');
}

function saveToDrive(){
  if(!debtors.length){toast('داده‌ای نیست','error');return;}
  downloadBackup('✅ از Share، گزینه Drive یا Save to Files را انتخاب کن');
}

function downloadBackup(message){
  var data={version:'2.7',debtors:debtors,savedAt:new Date().toISOString()};
  var json=JSON.stringify(data,null,2),filename='backup-khata-sultan.json';
  var blob=new Blob([json],{type:'application/json;charset=utf-8'});
  var shareFile=null;
  try{shareFile=new File([json],filename,{type:'application/json'});}catch(e){}
  if(shareFile&&navigator.share&&navigator.canShare){
    try{
      if(navigator.canShare({files:[shareFile]})){
        navigator.share({files:[shareFile],title:'بکاپ دفتر حساب سلطان',text:'فایل بکاپ دفتر حساب'})
          .then(function(){toast(message,'success');})
          .catch(function(err){if(!err||err.name!=='AbortError')fallbackDownload(blob,filename,message);});
        return;
      }
    }catch(e){}
  }
  fallbackDownload(blob,filename,message);
}

function fallbackDownload(blob,filename,message){
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;a.rel='noopener';
  a.style.display='none';document.body.appendChild(a);
  try{a.click();}catch(e){toast('از منوی Share یا Save to Files استفاده کن','error');}
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1500);
  toast(message,'success');
}

function triggerImport(){$('importFile').click();}

function importBackup(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var normalized=normalizeData(JSON.parse(ev.target.result));
      if(normalized){debtors=normalized;save();current=null;$('detail').classList.remove('active');render();toast('✅ بازیابی شد','success');}
      else toast('فرمت نامعتبر','error');
    }catch(err){toast('فایل JSON نامعتبر است','error');}
  };
  reader.readAsText(file);e.target.value='';
}

function viewData(){
  try{
    var data=localStorage.getItem('khatabook_data');
    if(data){
      var p=JSON.parse(data);
      var count=p.debtors?p.debtors.length:0;
      var jsonText=JSON.stringify(p,null,2);
      var h='<h3>📊 دیتا</h3><p>تعداد حساب: '+count+'</p>'+
            '<pre id="dataDump" style="background:#2d2d2d;color:#fff;padding:10px;border-radius:8px;font-size:11px;overflow:auto;max-height:400px;direction:ltr;text-align:left;"></pre>'+
            '<div class="buttons"><button class="confirm" onclick="closeModal()">بستن</button></div>';
      modal(h);
      $('dataDump').textContent=jsonText;
      toast('✅ دیتا نمایش داده شد','success');
    }else{toast('دیتایی نیست','error');}
  }catch(e){toast('خطا','error');}
}

function toast(x,t){t=t||'';var el=$('toast');el.textContent=x;el.className='toast show'+(t?' '+t:'');clearTimeout(el._t);el._t=setTimeout(function(){el.className='toast';},3000);}
function modal(html){$('modal').innerHTML=html;$('modalbg').classList.add('active');}
function closeModal(){$('modalbg').classList.remove('active');}

function actionTarget(node){
  while(node&&node!==document){
    if(node.getAttribute&&node.getAttribute('data-action'))return node;
    node=node.parentNode;
  }
  return null;
}

document.addEventListener('click',function(e){
  var btn=actionTarget(e.target);
  if(!btn)return;
  e.preventDefault();
  var action=btn.getAttribute('data-action');
  if(action==='backup')exportBackup();
  else if(action==='koder')saveToKoder();
  else if(action==='drive')saveToDrive();
  else if(action==='import')triggerImport();
  else if(action==='data')viewData();
  else if(action==='lock')lockNow();
  else if(action==='changepin')changePin();
  else if(action==='sync')manualSync();
  else if(action==='faceid')faceIDSettings();
},true);

// ========================== جستجو ==========================
function searchItem(d,q){
  if(normalizeDigits(String(d.name||'')).toLowerCase().indexOf(q)!==-1||normalizeDigits(String(d.phone||'')).toLowerCase().indexOf(q)!==-1||normalizeDigits(String(d.address||'')).toLowerCase().indexOf(q)!==-1||normalizeDigits(String(d.khataNumber||'')).toLowerCase().indexOf(q)!==-1)return true;
  if(d.transactions)for(var i=0;i<d.transactions.length;i++){var t=d.transactions[i],hay=[t.date,t.details,t.receipt,t.debtVal,t.page,t.currency].join(' ');if(normalizeDigits(hay).toLowerCase().indexOf(q)!==-1)return true;}
  return false;
}

// ========================== رندر ==========================
function render(){
  var q=normalizeDigits($('search').value).trim().toLowerCase();
  var list=[];
  if(q){for(var i=0;i<debtors.length;i++){if(searchItem(debtors[i],q))list.push(debtors[i]);}}else{list=debtors.slice();}

  if(filterMode==='debtor')list=list.filter(function(d){return netRemaining(d)<0;});
  else if(filterMode==='creditor')list=list.filter(function(d){return netRemaining(d)>0;});

  if(sortMode==='name')list.sort(function(a,b){return String(a.name).localeCompare(String(b.name),'fa');});
  else if(sortMode==='remDesc')list.sort(function(a,b){return netRemaining(a)-netRemaining(b);});
  else if(sortMode==='remAsc')list.sort(function(a,b){return netRemaining(b)-netRemaining(a);});
  else if(sortMode==='lastTx')list.sort(function(a,b){return lastTxDate(b).localeCompare(lastTxDate(a));});

  var cntEl=$('accountCount');
  if(cntEl){
    cntEl.textContent = '('+num(debtors.length)+' حساب)';
  }
  
  var tA=0,tD=0,uA=0,uD=0;
  for(var i=0;i<debtors.length;i++){var t=getTotals(debtors[i]);tA+=t.afnR;tD+=t.afnD;uA+=t.usdR;uD+=t.usdD;}
  $('summary').innerHTML=summaryCardsHtml(tA,uA,tD,uD);
  
  if(!list.length){$('rows').innerHTML='<tr><td colspan="6" class="empty-state">حسابی پیدا نشد</td></tr>';return;}

  var maxDebtAbs=0;
  for(var k=0;k<list.length;k++){var nr0=netRemaining(list[k]);if(nr0<0&&Math.abs(nr0)>maxDebtAbs)maxDebtAbs=Math.abs(nr0);}

  var h='';
  for(var i=0;i<list.length;i++){
    var d=list[i],t=getTotals(d),idx=debtors.indexOf(d)+1,khata=d.khataNumber||'-';
    var nr=netRemaining(d);
    var isHot=maxDebtAbs>0&&nr<0&&Math.abs(nr)>=maxDebtAbs*0.6;
    var rowCls=isHot?' class="hot-row"':'';
    var remExtra=isHot?'🔥 ':'';

// ========================== ارسال واتساپ / چاپ صورت حساب ==========================
function buildStatementText(d){
  var t=getTotals(d);
  var lines=[];
  lines.push('📒 صورت حساب: '+d.name);
  if(d.khataNumber)lines.push('نمبر کهاته: '+d.khataNumber);
  if(d.address)lines.push('آدرس: '+d.address);
  lines.push('');
  var s=sortedTx(d);
  if(s.length){
    var runA=0,runU=0;
    for(var i=0;i<s.length;i++){
      var tx=s[i],c=tx.currency||'AFN',rr=storedAmount(tx.receipt),dd=storedAmount(tx.debtVal);
      if(c==='USD')runU+=rr-dd;else runA+=rr-dd;
      var line=tx.date+' | '+tx.details;
      if(rr)line+=' | رسید: '+num(rr)+' '+c;
      if(dd)line+=' | قرض: '+num(dd)+' '+c;
      lines.push(line);
    }
  }else{
    lines.push('هنوز معامله‌ای ثبت نشده');
  }
  lines.push('');
  lines.push('باقی مانده فعلی: '+(t.afnRem?num(t.afnRem)+' AFN ':'')+(t.usdRem?num(t.usdRem)+' USD':''));
  return lines.join('\n');
}
function sendStatementWhatsApp(d){
  var text=encodeURIComponent(buildStatementText(d));
  var phoneDigits=String(d.phone||'').replace(/\D/g,'');
  var url=phoneDigits?('https://wa.me/'+phoneDigits+'?text='+text):('https://api.whatsapp.com/send?text='+text);
  window.open(url,'_blank');
}
function printStatement(d){
  var t=getTotals(d);
  var s=sortedTx(d);
  var rows='';
  var runA=0,runU=0;
  if(s.length){
    for(var i=0;i<s.length;i++){
      var tx=s[i],c=tx.currency||'AFN',rr=storedAmount(tx.receipt),dd=storedAmount(tx.debtVal);
      if(c==='USD')runU+=rr-dd;else runA+=rr-dd;
      rows+='<tr><td>'+esc(tx.date)+'</td><td style="text-align:right">'+esc(tx.details)+'</td><td>'+(rr?num(rr)+' '+c:'-')+'</td><td>'+(dd?num(dd)+' '+c:'-')+'</td></tr>';
    }
  }else{
    rows='<tr><td colspan="4" style="text-align:center">هنوز معامله‌ای ثبت نشده</td></tr>';
  }
  var html='<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><title>صورت حساب '+esc(d.name)+'</title>'+
    '<style>body{font-family:Tahoma,sans-serif;padding:20px;color:#222}h1{font-size:18px;border-bottom:2px solid #c40d0d;padding-bottom:8px}'+
    'table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #999;padding:6px;font-size:12px;text-align:center}'+
    'th{background:#eee}.meta{font-size:13px;margin:4px 0}.bal{margin-top:14px;font-size:15px;font-weight:bold;text-align:center;border:1.5px solid #c40d0d;padding:10px;border-radius:8px}</style></head><body>'+
    '<h1>📒 صورت حساب: '+esc(d.name)+'</h1>'+
    (d.khataNumber?'<div class="meta">نمبر کهاته: '+esc(d.khataNumber)+'</div>':'')+
    (d.address?'<div class="meta">آدرس: '+esc(d.address)+'</div>':'')+
    (d.phone?'<div class="meta">تلفن: '+esc(d.phone)+'</div>':'')+
    '<table><thead><tr><th>تاریخ</th><th>شرح</th><th>رسید</th><th>قرض</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="bal">باقی مانده فعلی: '+(t.afnRem?num(t.afnRem)+' AFN ':'')+(t.usdRem?num(t.usdRem)+' USD':'')+'</div>'+
    '<script>window.onload=function(){window.print();};<\/script>'+
    '</body></html>';
  var win=window.open('','_blank');
  if(!win){toast('اجازه بازکردن پنجره داده نشد؛ Pop-up را فعال کنید','error');return;}
  win.document.open();win.document.write(html);win.document.close();

function editTransaction(txId){
  var d=null;for(var j=0;j<debtors.length;j++){if(+debtors[j].id===+current){d=debtors[j];break;}}if(!d)return;
  var tIdx=-1;for(var k=0;k<d.transactions.length;k++){if(+d.transactions[k].id===+txId){tIdx=k;break;}}if(tIdx===-1)return;
  var t=d.transactions[tIdx],isR=(+t.receipt||+t.debt)>0,v=isR?(t.receipt||t.debt):(t.debtVal||t.paid),curr=t.currency||'AFN';
  modal('<h3>ویرایش معامله</h3><label>ارز</label><select id="curr"><option value="AFN"'+(curr==='AFN'?' selected':'')+'>AFN</option><option value="USD"'+(curr==='USD'?' selected':'')+'>USD</option></select><label>تاریخ</label><input id="txDate" type="text" inputmode="numeric" lang="en" dir="ltr" value="'+esc(t.date)+'" oninput="normalizeDateInput(this)"><label>مبلغ</label><input id="amt" type="text" inputmode="decimal" lang="en" dir="ltr" placeholder="مبلغ" style="text-align:left;" value="'+esc(v)+'" oninput="sanitizeAmountInput(this)"><label>شرح</label><input id="det" type="text" value="'+esc(t.details)+'"><label>بل</label><input id="page" type="text" inputmode="numeric" lang="en" dir="ltr" value="'+esc(t.page||'')+'" oninput="normalizeNumberInput(this)"><div class="buttons"><button class="cancel" onclick="closeModal()">لغو</button><button class="confirm red" id="delTx">🗑 حذف</button><button class="confirm" id="saveTx">💾 ذخیره</button></div>');
  $('delTx').onclick=function(){if(confirm('آیا مطمئن هستید؟')){d.transactions.splice(tIdx,1);save();closeModal();renderDetail();render();toast('✅ حذف شد','success');}};
   $('saveTx').onclick=function(){var v2=amount($('amt').value);if(!isFinite(v2)){toast('مبلغ معتبر','error');$('amt').focus();return;}t.currency=$('curr').value;t.receipt=isR?v2:0;t.debtVal=isR?0:v2;t.details=$('det').value.trim()||'معامله';t.page=$('page').value.trim()||'';var nd=$('txDate').value.trim();if(nd)t.date=normalizeDateValue(nd);save();closeModal();renderDetail();render();toast('✅ ویرایش شد','success');};

function editField(kind){

  var cfg={
    name:{title:'✎ ویرایش اسم',label:'اسم',type:'text',dir:'rtl',extra:'',val:d.name},

function toolFindAccount(name){
  if(!name || !String(name).trim()) return {error:'نام حساب داده نشده است'};
  var q = String(name).trim().toLowerCase();
  var exact = debtors.filter(function(d){ return d.name.toLowerCase()===q; });
  if(exact.length===1) return {account: exact[0]};
  if(exact.length>1) return {error:'چند حساب با نام دقیقاً یکسان پیدا شد، لطفاً مشخص‌تر بگویید'};
  var partial = debtors.filter(function(d){ return d.name.toLowerCase().indexOf(q)!==-1; });
  if(partial.length===1) return {account: partial[0]};
  if(partial.length>1) return {error:'چند حساب مشابه پیدا شد: '+partial.map(function(d){return d.name;}).join('، ')+' — لطفاً نام دقیق‌تر بگویید'};
  return {error:'حسابی با نام «'+name+'» پیدا نشد'};
}

function validNormalizedDate(v){
  var s = String(v||'').trim();
  var m = s.match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
  if(!m) return false;
  var y=Number(m[1]), mo=Number(m[2]), d=Number(m[3]);
  return y>=1 && mo>=1 && mo<=12 && d>=1 && d<=31;
}

function sortedTx(d){
  return d.transactions.slice().sort(function(a,b){ return String(a.date||'').localeCompare(String(b.date||'')); });
}

function executeChatTool(toolName, input){
  input = input || {};
  try{
    if(toolName==='delete_account' || toolName==='delete_transaction' || toolName==='restore_backup'){
      if(input.__confirmed_by_user !== true){
        return {error:'تأیید صریح کاربر برای این عملیات لازم است؛ عملیات اجرا نشد'};
      }
      delete input.__confirmed_by_user;
    }
    if(toolName === 'add_account'){
      var name = String(input.name||'').trim();
      if(!name) return {error:'نام الزامی است'};
      var dup = debtors.some(function(d){ return d.name.toLowerCase()===name.toLowerCase(); });
      if(dup) return {error:'حسابی با این نام از قبل وجود دارد'};
      var nd = {id:Date.now(), name:name, phone:String(input.phone||'').trim(), address:String(input.address||'').trim(), transactions:[]};
      debtors.push(nd); save(); refreshAppUI();
      return {success:true, message:'حساب «'+name+'» با موفقیت اضافه شد'};
    }

    if(toolName === 'add_transaction'){
      var found = toolFindAccount(input.account_name);
      if(found.error) return {error:found.error};
      var d = found.account;
      if(input.type!=='receipt' && input.type!=='debt') return {error:'نوع معامله باید receipt یا debt باشد'};
      var amt = Number(input.amount);
      if(!isFinite(amt) || amt<=0) return {error:'مبلغ نامعتبر است'};
      var isR = input.type==='receipt';
      var currency = input.currency==='USD' ? 'USD' : 'AFN';
      var date = normalizeDateValue(input.date ? input.date : today());
      if(!validNormalizedDate(date)) return {error:'تاریخ نامعتبر است؛ تاریخ را به شکل YYYY/MM/DD وارد کنید'};
      var tx = {id:Date.now()+Math.floor(Math.random()*1000), date:date, currency:currency,
        details:String(input.details||'').trim() || (isR?'رسید':'قرض'),
        receipt:isR?amt:0, debtVal:isR?0:amt, page:String(input.page||'').trim()};
      d.transactions.push(tx); save(); refreshAppUI();
      return {success:true, message:(isR?'رسید':'قرض')+' به مبلغ '+num(amt)+' '+currency+' برای «'+d.name+'» ثبت شد'};
    }

    if(toolName === 'edit_account'){
      var found2 = toolFindAccount(input.account_name);
      if(found2.error) return {error:found2.error};
      var d2 = found2.account;
      if(input.new_name && String(input.new_name).trim()){
        var nn = String(input.new_name).trim();
        var dup2 = debtors.some(function(x){ return x!==d2 && x.name.toLowerCase()===nn.toLowerCase(); });
        if(dup2) return {error:'حساب دیگری با این نام وجود دارد'};
        d2.name = nn;
      }
      if(input.phone!==undefined) d2.phone = String(input.phone).trim();
      if(input.address!==undefined) d2.address = String(input.address).trim();
      save(); refreshAppUI();
      return {success:true, message:'اطلاعات حساب «'+d2.name+'» ذخیره شد'};
    }

    if(toolName === 'delete_account'){
      var found3 = toolFindAccount(input.account_name);
      if(found3.error) return {error:found3.error};
      var deletedName = found3.account.name;
      debtors = debtors.filter(function(x){ return x!==found3.account; });
      save(); refreshAppUI();
      return {success:true, message:'حساب «'+deletedName+'» حذف شد'};
    }

    if(toolName === 'list_accounts'){
      var query = String(input.query||'').trim().toLowerCase();
      var list = query ? debtors.filter(function(d){ return searchItem(d, normalizeDigits(query)); }) : debtors;
      var result = list.map(function(d){
        var t = getTotals(d);
        return {name:d.name, phone:d.phone, address:d.address,
          receipt_afn:t.afnR, debt_afn:t.afnD, remaining_afn:t.afnRem,
          receipt_usd:t.usdR, debt_usd:t.usdD, remaining_usd:t.usdRem};
      });
      return {accounts:result, count:result.length};
    }

    if(toolName === 'get_account_details'){
      var found4 = toolFindAccount(input.account_name);
      if(found4.error) return {error:found4.error};
      var d4 = found4.account, t4 = getTotals(d4), s4 = sortedTx(d4);
      var txList = s4.map(function(tx,i){
        return {index:i+1, date:tx.date, type: tx.receipt>0?'receipt':'debt',
          amount: tx.receipt>0?tx.receipt:tx.debtVal, currency:tx.currency, details:tx.details, page:tx.page};
      });
      return {name:d4.name, phone:d4.phone, address:d4.address, totals:t4, transactions:txList};
    }

    if(toolName === 'edit_transaction'){
      var found5 = toolFindAccount(input.account_name);
      if(found5.error) return {error:found5.error};
      var d5 = found5.account, s5 = sortedTx(d5);
      var idx5 = Number(input.transaction_index) - 1;
      if(!isFinite(idx5) || idx5<0 || idx5>=s5.length) return {error:'شماره ردیف معامله نامعتبر است؛ ابتدا با get_account_details شماره درست را بگیرید'};
      var tx5 = s5[idx5];
      var isR5 = input.type ? input.type==='receipt' : (tx5.receipt>0);
      var amt5 = input.amount!==undefined ? Number(input.amount) : (isR5?tx5.receipt:tx5.debtVal);
      if(!isFinite(amt5) || amt5<=0) return {error:'مبلغ نامعتبر است'};
      if(input.currency) tx5.currency = input.currency==='USD'?'USD':'AFN';
      tx5.receipt = isR5?amt5:0; tx5.debtVal = isR5?0:amt5;
      if(input.date){
        var nd5 = normalizeDateValue(input.date);
        if(!validNormalizedDate(nd5)) return {error:'تاریخ نامعتبر است؛ تاریخ را به شکل YYYY/MM/DD وارد کنید'};
        tx5.date = nd5;
      }
      if(input.details!==undefined && String(input.details).trim()) tx5.details = String(input.details).trim();
      if(input.page!==undefined) tx5.page = String(input.page).trim();
      save(); refreshAppUI();
      return {success:true, message:'معامله شماره '+input.transaction_index+' برای «'+d5.name+'» ویرایش شد'};
    }

    if(toolName === 'delete_transaction'){
      var found6 = toolFindAccount(input.account_name);
      if(found6.error) return {error:found6.error};
      var d6 = found6.account, s6 = sortedTx(d6);
      var idx6 = Number(input.transaction_index) - 1;
      if(!isFinite(idx6) || idx6<0 || idx6>=s6.length) return {error:'شماره ردیف معامله نامعتبر است'};
      var tx6 = s6[idx6];
      var realIdx6 = d6.transactions.indexOf(tx6);
      d6.transactions.splice(realIdx6, 1);
      save(); refreshAppUI();
      return {success:true, message:'معامله شماره '+input.transaction_index+' از «'+d6.name+'» حذف شد'};
    }

    if(toolName === 'get_summary'){
      var tA=0,tD=0,uA=0,uD=0;
      for(var i=0;i<debtors.length;i++){ var t=getTotals(debtors[i]); tA+=t.afnR; tD+=t.afnD; uA+=t.usdR; uD+=t.usdD; }
      return {receipt_afn:tA, debt_afn:tD, remaining_afn:tA-tD, receipt_usd:uA, debt_usd:uD, remaining_usd:uA-uD, account_count:debtors.length};
    }

    if(toolName === 'create_backup'){
      if(!debtors.length) return {error:'هیچ داده‌ای برای بکاپ گرفتن وجود ندارد'};
      downloadBackup('✅ بکاپ ذخیره شد');
      return {success:true, message:'فایل بکاپ ساخته و برای دانلود/اشتراک‌گذاری آماده شد'};
    }

    if(toolName === 'restore_backup'){
      var raw = input.json_data;
      if(!raw || !String(raw).trim()) return {error:'محتوای JSON بکاپ داده نشده است'};
      var parsed;
      try{ parsed = JSON.parse(raw); }catch(e){ return {error:'متن ارسالی یک JSON معتبر نیست'}; }
      var normalized = normalizeData(parsed);
      if(!normalized) return {error:'فرمت بکاپ نامعتبر است (ساختار debtors پیدا نشد)'};
      debtors = normalized; save();
      current = null; $('detail').classList.remove('active');
      render();
      return {success:true, message:'بازیابی انجام شد؛ تعداد حساب‌های بازیابی‌شده: '+debtors.length};
    }

    if(toolName === 'open_account_view'){
      var foundV = toolFindAccount(input.account_name);
      if(foundV.error) return foundV;
      openDetail(foundV.account.id);
      closeChat();
      return {success:true, message:'صفحه حساب «'+foundV.account.name+'» باز شد'};
    }

    return {error:'ابزار ناشناخته'};
  }catch(e){
    return {error:'خطای داخلی هنگام اجرای عملیات'};
  }
}

var GEMINI_MODEL = 'gemini-2.0-flash';

function convertSchemaToGemini(schema){
  if(!schema || typeof schema !== 'object') return schema;
  var out = {};
  if(schema.type) out.type = String(schema.type).toUpperCase();
  if(schema.description) out.description = schema.description;
  if(schema.enum) out.enum = schema.enum;
  if(schema.properties){
    out.properties = {};
    for(var k in schema.properties){ out.properties[k] = convertSchemaToGemini(schema.properties[k]); }
  }
  if(schema.items) out.items = convertSchemaToGemini(schema.items);
  if(schema.required) out.required = schema.required;
  return out;
}
function toolsForGemini(){
  return [{ functionDeclarations: CHAT_TOOLS.map(function(t){
    return { name:t.name, description:t.description, parameters: convertSchemaToGemini(t.input_schema) };
  }) }];
}

function callGeminiAPI(contents){
  var key = getApiKey();
  var url = 'https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL+':generateContent';
  return fetch(url, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({
      contents: contents,
      tools: toolsForGemini(),
      systemInstruction: { parts:[{ text: CHAT_SYSTEM_PROMPT }] }
    })
  }).then(function(res){
    return res.json().then(function(data){
      if(!res.ok && !data.error){
        data.error={message:'HTTP '+res.status+' '+(res.statusText||'خطا در پاسخ Gemini')};
      }
      return data;
    });
  });
}

function sendChatMessage(){
  var input = $('chatInput');
  var text = input.value.trim();
  if(!text) return;

  if(!getApiKey()){
    promptForApiKey();
    return;
  }

  input.value = ''; input.style.height = 'auto';

  if(pendingDangerousCall){
    var pending = pendingDangerousCall;
    if(isExplicitChatConfirmation(text)){
      pendingDangerousCall = null;
      pending.args = pending.args || {};
      pending.args.__confirmed_by_user = true;

      chatConversation.push({role:'user', parts:[{text:text}]});
      saveChatHistory();
      renderChatMessages();

      var confirmBtn = $('chatSendBtn');
      confirmBtn.disabled = true;
      var confirmBox = $('chatMessages');
      var confirmThinking = document.createElement('div');
      confirmThinking.className = 'chat-msg thinking';
      confirmThinking.textContent = 'در حال انجام عملیات...';
      confirmBox.appendChild(confirmThinking);
      confirmBox.scrollTop = confirmBox.scrollHeight;

      var result = executeChatTool(pending.name, pending.args);
      chatConversation.push({
        role:'user',
        parts:[{functionResponse:{name:pending.name, response:result}}]
      });
      saveChatHistory();
      confirmThinking.remove();

      var finalThinking = document.createElement('div');
      finalThinking.className = 'chat-msg thinking';
      finalThinking.textContent = 'در حال فکر کردن...';
      confirmBox.appendChild(finalThinking);
      confirmBox.scrollTop = confirmBox.scrollHeight;
      runAgentLoop(0, finalThinking, confirmBtn);
      return;
    }

    if(isExplicitChatCancellation(text)){
      pendingDangerousCall = null;
      chatConversation.push({role:'user', parts:[{text:text}]});
      chatConversation.push({role:'model', parts:[{text:'لغو شد؛ هیچ تغییری در اطلاعات انجام نشد.'}]});
      saveChatHistory();
      renderChatMessages();
      return;
    }

    pendingDangerousCall = null;
    chatConversation.push({role:'user', parts:[{text:text}]});
    chatConversation.push({role:'model', parts:[{text:'تأیید واضح دریافت نشد؛ عملیات لغو شد و هیچ تغییری در اطلاعات انجام نشد.'}]});
    saveChatHistory();
    renderChatMessages();
    return;
  }

  chatConversation.push({role:'user', parts:[{text:text}]});
  saveChatHistory();
  renderChatMessages();

  var sendBtn = $('chatSendBtn');
  sendBtn.disabled = true;

  var box = $('chatMessages');
  var thinkingEl = document.createElement('div');
  thinkingEl.className = 'chat-msg thinking';
  thinkingEl.textContent = 'در حال فکر کردن...';
  box.appendChild(thinkingEl);
  box.scrollTop = box.scrollHeight;

  runAgentLoop(0, thinkingEl, sendBtn);
}

function runAgentLoop(depth, thinkingEl, sendBtn, retryCount){
  retryCount = retryCount || 0;
  if(depth > 6){
    if(thinkingEl) thinkingEl.remove();
    showChatError('تعداد مراحل عملیات زیاد شد؛ لطفاً درخواست را ساده‌تر یا در چند پیام مطرح کنید.');
    sendBtn.disabled = false;
    return;
  }
  callGeminiAPI(chatConversation).then(function(data){
    if(data && data.error){
      var msg = String(data.error.message || '');
      var isOverloaded = /overload|high demand|503|unavailable|429|quota/i.test(msg);
      if(isOverloaded && retryCount < 3){
        if(thinkingEl) thinkingEl.textContent = 'سرور شلوغ است، دوباره تلاش می‌کنم... ('+(retryCount+1)+'/3)';
        setTimeout(function(){ runAgentLoop(depth, thinkingEl, sendBtn, retryCount+1); }, 2500);
        return;
      }
      if(thinkingEl) thinkingEl.remove();
      showChatError('خطا از سرور: '+(msg || 'کلید API نامعتبر است یا مشکلی پیش آمد'));
      sendBtn.disabled = false;
      return;
    }
    if(thinkingEl) thinkingEl.remove();
    var candidate = data && Array.isArray(data.candidates) ? data.candidates[0] : null;
    var parts = candidate && candidate.content && candidate.content.parts;
    if(!parts || !parts.length){
      showChatError('پاسخی دریافت نشد. دوباره تلاش کنید.');
      sendBtn.disabled = false;
      return;
    }

    chatConversation.push({role:'model', parts: parts});
    saveChatHistory();
    renderChatMessages();

    var funcCalls = parts.filter(function(p){ return !!p.functionCall; });

    if(!funcCalls.length){
      sendBtn.disabled = false;
      return;
    }

    var box = $('chatMessages');
    var busyEl = document.createElement('div');
    busyEl.className = 'chat-msg thinking';
    busyEl.textContent = 'در حال انجام عملیات...';
    box.appendChild(busyEl);
    box.scrollTop = box.scrollHeight;

    var dangerousCall = null;
    for(var di=0; di<funcCalls.length; di++){
      var dn = funcCalls[di].functionCall.name;
      if(dn==='delete_account' || dn==='delete_transaction' || dn==='restore_backup'){
        dangerousCall = funcCalls[di].functionCall;
        break;
      }
    }

    if(dangerousCall){
      pendingDangerousCall = {
        name: dangerousCall.name,
        args: dangerousCall.args || {}
      };

      var warning = '⚠️ برای اجرای «'+dangerousToolLabel(dangerousCall.name)+'» تأیید صریح لازم است.';
      if(dangerousCall.name==='delete_account' && dangerousCall.args && dangerousCall.args.account_name){
        warning += '\nحساب «'+String(dangerousCall.args.account_name)+'» و تمام معاملاتش حذف می‌شود.';
      } else if(dangerousCall.name==='delete_transaction' && dangerousCall.args){
        warning += '\nمعامله شماره '+String(dangerousCall.args.transaction_index||'')+' از حساب «'+String(dangerousCall.args.account_name||'')+'» حذف می‌شود.';
      } else if(dangerousCall.name==='restore_backup'){
        warning += '\nتمام داده‌های فعلی با اطلاعات بکاپ جایگزین می‌شود.';
      }
      warning += '\nاگر مطمئن هستی بنویس «بله» یا «تایید». برای لغو «نه» بنویس.';

      chatConversation.push({role:'model', parts:[{text:warning}]});
      saveChatHistory();
      renderChatMessages();
      busyEl.remove();
      sendBtn.disabled = false;
      return;
    }

    var responseParts = funcCalls.map(function(fc){
      var result = executeChatTool(fc.functionCall.name, fc.functionCall.args || {});
      return { functionResponse: { name: fc.functionCall.name, response: result } };
    });

    chatConversation.push({role:'user', parts: responseParts});
    saveChatHistory();

    busyEl.remove();
    var thinkingEl2 = document.createElement('div');
    thinkingEl2.className = 'chat-msg thinking';
    thinkingEl2.textContent = 'در حال فکر کردن...';
    box.appendChild(thinkingEl2);
    box.scrollTop = box.scrollHeight;

    runAgentLoop(depth+1, thinkingEl2, sendBtn);
  }).catch(function(err){
    if(thinkingEl) thinkingEl.remove();
    showChatError('خطا در ارتباط. اتصال اینترنت را بررسی کنید.');
    sendBtn.disabled = false;
  });
}

function showChatError(msg){
  var box = $('chatMessages');
  var errEl = document.createElement('div');
  errEl.className = 'chat-msg error';
  errEl.textContent = msg;
  box.appendChild(errEl);
  box.scrollTop = box.scrollHeight;
}

// ========================== قفل برنامه (PIN) ==========================
function hashPin(pin){
  if(window.crypto && window.crypto.subtle){
    var enc = new TextEncoder().encode('khsalt_'+pin);
    return crypto.subtle.digest('SHA-256', enc).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    });
  }
  var s = 'khsalt_'+pin, h=0;
  for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return Promise.resolve('fb'+h.toString(16));
}

function webauthnSupported(){
  return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
}
function randomBytes(len){
  var a = new Uint8Array(len);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for(var i=0;i<len;i++) a[i]=Math.floor(Math.random()*256);
  return a;
}
function bufToB64(buf){
  var bytes = new Uint8Array(buf), bin='';
  for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToBuf(b64){
  var bin = atob(b64), bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}
function isFaceIDEnabled(){ return !!localStorage.getItem('khatabook_faceid_id'); }

function enableFaceID(onDone){
  if(!webauthnSupported()){ toast('Face ID/Touch ID روی این دستگاه یا مرورگر پشتیبانی نمی‌شود','error'); return; }
  navigator.credentials.create({
    publicKey:{
      challenge: randomBytes(32),
      rp:{ name:'دفتر کهاته سلطان' },
      user:{ id: randomBytes(16), name:'کاربر دفتر', displayName:'کاربر دفتر' },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' },
      timeout:60000,
      attestation:'none'
    }
  }).then(function(cred){
    localStorage.setItem('khatabook_faceid_id', bufToB64(cred.rawId));
    toast('✅ Face ID/Touch ID فعال شد','success');
    if(onDone) onDone(true);
  }).catch(function(err){
    console.error('webauthn create error', err);
    toast('فعال‌سازی Face ID لغو شد یا با خطا مواجه شد','error');
    if(onDone) onDone(false);
  });
}

function disableFaceID(){
  localStorage.removeItem('khatabook_faceid_id');
  toast('Face ID غیرفعال شد','success');
}

function tryFaceIDUnlock(){
  var idB64 = localStorage.getItem('khatabook_faceid_id');
  if(!idB64) return;
  var msgEl = $('lockMsg');
  if(msgEl) msgEl.textContent = '';
  navigator.credentials.get({
    publicKey:{
      challenge: randomBytes(32),
      allowCredentials:[{ id:b64ToBuf(idB64), type:'public-key' }],
      userVerification:'required',
      timeout:60000
    }
  }).then(function(){
    hideLock();
  }).catch(function(err){
    console.error('webauthn get error', err);
    var m = $('lockMsg'); if(m) m.textContent='Face ID ناموفق بود؛ رمز را وارد کنید';
  });
}

    '<label>رمز جدید</label><input id="newPin1" type="password" inputmode="numeric" maxlength="6" dir="ltr">'+
    '<label>تکرار رمز جدید</label><input id="newPin2" type="password" inputmode="numeric" maxlength="6" dir="ltr">'+
    '<div class="buttons"><button class="cancel" onclick="closeModal()">لغو</button><button class="confirm" id="savePinBtn">ذخیره</button></div>');
  $('savePinBtn').onclick = function(){
    var op=$('oldPin').value.trim(), n1=$('newPin1').value.trim(), n2=$('newPin2').value.trim();
    hashPin(op).then(function(oh){
      if(oh!==hash){ toast('رمز فعلی اشتباه است','error'); return; }
      if(!/^\d{4,6}$/.test(n1)){ toast('رمز جدید باید ۴ تا ۶ رقم باشد','error'); return; }
      if(n1!==n2){ toast('رمزهای جدید یکسان نیستند','error'); return; }
      hashPin(n1).then(function(nh){
        localStorage.setItem('khatabook_pin_hash', nh);
        closeModal();
        toast('✅ رمز تغییر کرد','success');
      });
    });
  };
  setTimeout(function(){ var el=$('oldPin'); if(el) el.focus(); }, 200);
}

loadChatHistory();
load();
applyDarkMode();
applyZoom();
var sortSelEl=$('sortSel'); if(sortSelEl) sortSelEl.value=sortMode; syncSortLabel();
render();
initLock();
</script>
